name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typen, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Modell-Tests inkl. Prüfung aller Dateien in plans/ und designs/
      # (auch der, die über „Synchronisieren“ direkt auf main landen)
      - name: Unit-Tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: End-to-End (Browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Durchstich durch die App
        run: npx playwright test --trace off
        working-directory: apps/web
      - name: Fehlerbericht hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7
